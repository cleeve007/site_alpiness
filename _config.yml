url: "https://alpinessenoisans.com"
title: "Alpiness en Oisans"
description: "Treks, randonnées accompagnées et séjours sur mesure dans les Alpes et ailleurs."
lang: fr-FR

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

collections:
  treks:
    output: true
    permalink: /treks/:name/

defaults:
  - scope:
      path: ""
      type: treks
    values:
      layout: trek

